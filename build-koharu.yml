name: Build Koharu Client V7

on:
  workflow_dispatch:
  push:
    paths:
      - "koharu-github-upload-v7.zip"
      - ".github/workflows/build-koharu.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract Koharu V7
        run: |
          mkdir project
          unzip -q koharu-github-upload-v7.zip -d project

      - name: Build Koharu Client
        run: |
          GRADLE_FILE=$(find project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          chmod +x "$GRADLE_FILE"
          cd "$PROJECT_DIR"
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Koharu-Client-V7
          path: project/**/build/libs/*.jar
          if-no-files-found: error
