name: Build Koharu Client V7

on:
workflow_dispatch:
push:
paths:
- "koharu-github-upload-v7.zip"
- ".github/workflows/build-koharu.yml"

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "21"

  - name: Check V7 ZIP
    run: |
      if [ ! -f "koharu-github-upload-v7.zip" ]; then
        echo "ERROR: V7 ZIP not found!"
        exit 1
      fi

      echo "Koharu V7 ZIP found."

  - name: Extract Koharu V7
    run: |
      mkdir -p project
      unzip -q koharu-github-upload-v7.zip -d project

  - name: Find Gradle Project
    id: gradle
    run: |
      GRADLE_FILE=$(find project -type f -name gradlew -print -quit)

      if [ -z "$GRADLE_FILE" ]; then
        echo "ERROR: gradlew not found in V7 ZIP"
        find project -maxdepth 3 -type f | head -100
        exit 1
      fi

      PROJECT_DIR=$(dirname "$GRADLE_FILE")

      echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

  - name: Build Koharu V7
    working-directory: .
    run: |
      set -e

      cd "${{ steps.gradle.outputs.project_dir }}"

      chmod +x gradlew
      sed -i 's/\r$//' gradlew

      ./gradlew build --no-daemon

  - name: Upload Koharu V7 JAR
    uses: actions/upload-artifact@v4
    with:
      name: Koharu-Client-V7
      path: project/**/build/libs/*.jar
      if-no-files-found: error
      retention-days: 14
