name: Build Koharu Client V7

on:
  workflow_dispatch:
  push:
    paths:
      - "koharu-github-upload-v7.zip"
      - ".github/workflows/build-koharu.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check V7 ZIP
        run: |
          if [ ! -f "koharu-github-upload-v7.zip" ]; then
            echo "ERROR: V7 ZIP not found!"
            exit 1
          fi
          echo "Found Koharu V7 ZIP"

      - name: Extract Koharu V7
        run: |
          mkdir -p project
          unzip -q koharu-github-upload-v7.zip -d project

      - name: Build Koharu V7
        run: |
          set -e

          GRADLE_FILE=$(find project -type f -name gradlew -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found in V7 ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          cd "$PROJECT_DIR"

          chmod +x gradlew
          sed -i 's/\r$//' gradlew

          ./gradlew build --no-daemon

      - name: Upload V7 JAR
        uses: actions/upload-artifact@v4
        with:
          name: Koharu-Client-V7
          path: project/**/build/libs/*.jar
          if-no-files-found: error
